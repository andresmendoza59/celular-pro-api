sonar.projectKey=andresmendoza59_celular-pro-api
sonar.organization=andresmendoza59


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=celular-pro-api
sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src

# Exclude node_modules, build outputs, and tests from main coverage/analysis
sonar.exclusions=**/node_modules/**, **/dist/**, **/coverage/**

# Identify test files so Sonar processes them separately
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info


